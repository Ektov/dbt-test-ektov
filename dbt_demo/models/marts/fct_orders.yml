version: 2

# Native dbt unit tests (dbt 1.8+) — MUST PASS
unit_tests:
  - name: test_fct_orders_calculated_total
    description: >
      Verifies calculated_total = sum(quantity * unit_price) per order
      and is_high_value when calculated_total >= 200.
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - order_id: 1
            user_id: 10
            order_date: "2024-07-01"
            order_status: completed
            total_amount: 150.00
          - order_id: 2
            user_id: 20
            order_date: "2024-07-02"
            order_status: pending
            total_amount: 250.00
      - input: ref('stg_order_items')
        rows:
          - item_id: 100
            order_id: 1
            product_id: 1
            quantity: 2
            unit_price: 25.00
          - item_id: 101
            order_id: 1
            product_id: 2
            quantity: 1
            unit_price: 50.00
          - item_id: 102
            order_id: 2
            product_id: 1
            quantity: 5
            unit_price: 50.00
      - input: ref('stg_products')
        rows:
          - product_id: 1
            product_name: "Widget A"
            category: electronics
            price: 25.00
          - product_id: 2
            product_name: "Gadget B"
            category: home
            price: 50.00
    expect:
      rows:
        # order 1: 2*25 + 1*50 = 100 → not high value
        - order_id: 1
          item_id: 100
          user_id: 10
          order_date: "2024-07-01"
          order_status: completed
          reported_total: 150.00
          product_id: 1
          product_name: "Widget A"
          category: electronics
          quantity: 2
          unit_price: 25.00
          line_total: 50.00
          calculated_total: 100.00
          is_high_value: false
        - order_id: 1
          item_id: 101
          user_id: 10
          order_date: "2024-07-01"
          order_status: completed
          reported_total: 150.00
          product_id: 2
          product_name: "Gadget B"
          category: home
          quantity: 1
          unit_price: 50.00
          line_total: 50.00
          calculated_total: 100.00
          is_high_value: false
        # order 2: 5*50 = 250 → high value
        - order_id: 2
          item_id: 102
          user_id: 20
          order_date: "2024-07-02"
          order_status: pending
          reported_total: 250.00
          product_id: 1
          product_name: "Widget A"
          category: electronics
          quantity: 5
          unit_price: 50.00
          line_total: 250.00
          calculated_total: 250.00
          is_high_value: true
