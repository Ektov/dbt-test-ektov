# dbt + Elementary + Airflow 3 (Astronomer Cosmos) local sandbox
# Postgres is the warehouse; Airflow uses a separate `airflow` database on the same instance.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: 'dcMyLsCwnIY_E95-eaMg4_EEMIegTJKkTa5gzEmGx6Q='
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # Airflow 3: LocalExecutor workers call the Execution API (not localhost).
    # Must use the docker-compose *service* name, or tasks fail with Connection refused
    # and "state mismatch ... finished with state failed, but ... is queued".
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API__BASE_URL: "http://airflow-api-server:8080"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__API_AUTH__JWT_SECRET: "local-sandbox-jwt-secret-change-me-32chars"
    AIRFLOW__API__SECRET_KEY: "local-sandbox-api-secret-key-32chars!!"
    # Simple Auth: "admin:admin" means username:ROLE (not password).
    # Fixed password lives in config/simple_auth_passwords.json → {"admin": "admin"}
    AIRFLOW__CORE__AUTH_MANAGER: "airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/simple_auth_manager_passwords.json"
    # Airflow Connection: path = database (demo_db). Cosmos maps conn.schema → dbt dbname.
    # profile_args.schema in the DAG sets dbt schema = dbt_marts.
    AIRFLOW_CONN_POSTGRES_DEFAULT: "postgresql://postgres:postgres@postgres:5432/demo_db"
    DBT_PROJECT_DIR: /opt/airflow/dbt_demo
    DBT_EXECUTABLE: /opt/airflow/dbt_venv/bin/dbt
    AIRFLOW_HOME: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt_demo:/opt/airflow/dbt_demo
    - ./profiles.yml:/opt/airflow/dbt_demo/profiles.yml:ro
    - ./config/simple_auth_passwords.json:/opt/airflow/simple_auth_manager_passwords.json
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  user: "${AIRFLOW_UID:-50000}:0"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dbt_sandbox_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: dbt_sandbox_airflow_init
    # Keep default image entrypoint (/entrypoint) so AIRFLOW_UID is handled;
    # with AIRFLOW_UID=50000 this matches the pre-created `airflow` user.
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        echo "Running as uid=$$(id -u) user=$$(id -un 2>/dev/null || echo unknown)"
        mkdir -p /opt/airflow/logs /opt/airflow/dags
        python -c "from cosmos import DbtDag; print('cosmos import OK:', __import__('importlib.metadata', fromlist=['version']).version('astronomer-cosmos'))"
        airflow db migrate
        echo "Airflow DB migrated successfully."
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: dbt_sandbox_airflow_api
    command: airflow api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: dbt_sandbox_airflow_scheduler
    command: airflow scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    container_name: dbt_sandbox_airflow_dag_processor
    command: airflow dag-processor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

volumes:
  postgres_data:
  airflow_logs:
